<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bee-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <linearGradient id="honey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
  </defs>
  
  <!-- Honey Jar -->
  <path d="M 60 120 C 40 120, 30 140, 30 160 C 30 180, 50 190, 80 190 C 110 190, 130 180, 130 160 C 130 140, 120 120, 100 120 Z" fill="rgba(255, 255, 255, 0.2)" stroke="#4DD0E1" stroke-width="4"/>
  <path d="M 65 120 L 95 120 L 95 110 L 65 110 Z" fill="#4DD0E1" />
  <path d="M 35 160 C 35 175, 55 185, 80 185 C 105 185, 125 175, 125 160 C 125 150, 115 140, 80 140 C 45 140, 35 150, 35 160 Z" fill="url(#honey)" />
  
  <!-- Bee Body -->
  <ellipse cx="120" cy="80" rx="35" ry="25" fill="url(#bee-body)" transform="rotate(-15 120 80)" />
  
  <!-- Bee Stripes -->
  <path d="M 100 60 Q 110 80 95 100" stroke="#212121" stroke-width="8" fill="none" transform="rotate(-15 120 80)" />
  <path d="M 120 60 Q 130 80 115 100" stroke="#212121" stroke-width="8" fill="none" transform="rotate(-15 120 80)" />
  
  <!-- Bee Head -->
  <circle cx="90" cy="65" r="20" fill="url(#bee-body)" />
  
  <!-- Glasses -->
  <circle cx="82" cy="62" r="8" fill="none" stroke="#212121" stroke-width="3" />
  <circle cx="102" cy="62" r="8" fill="none" stroke="#212121" stroke-width="3" />
  <line x1="90" y1="62" x2="94" y2="62" stroke="#212121" stroke-width="3" />
  <line x1="110" y1="60" x2="118" y2="55" stroke="#212121" stroke-width="3" />
  
  <!-- Eyes -->
  <circle cx="82" cy="62" r="3" fill="#212121" />
  <circle cx="102" cy="62" r="3" fill="#212121" />
  
  <!-- Smile -->
  <path d="M 85 75 Q 90 80 95 75" stroke="#212121" stroke-width="2" fill="none" />
  
  <!-- Antennae -->
  <path d="M 85 45 Q 80 35 75 40" stroke="#212121" stroke-width="2" fill="none" />
  <circle cx="75" cy="40" r="2" fill="#212121" />
  <path d="M 95 45 Q 100 35 105 40" stroke="#212121" stroke-width="2" fill="none" />
  <circle cx="105" cy="40" r="2" fill="#212121" />
  
  <!-- Wings -->
  <ellipse cx="140" cy="55" rx="15" ry="25" fill="rgba(255, 255, 255, 0.7)" stroke="#4DD0E1" stroke-width="2" transform="rotate(30 140 55)" />
  <ellipse cx="155" cy="65" rx="10" ry="20" fill="rgba(255, 255, 255, 0.5)" stroke="#4DD0E1" stroke-width="2" transform="rotate(45 155 65)" />
  
  <!-- Honey Dipper -->
  <path d="M 40 70 L 80 80" stroke="#8D6E63" stroke-width="6" stroke-linecap="round" />
  <ellipse cx="85" cy="82" rx="10" ry="6" fill="#FFC107" transform="rotate(15 85 82)" />
  <ellipse cx="87" cy="85" rx="8" ry="5" fill="#FFC107" transform="rotate(15 87 85)" />
  
  <!-- Honey Drip -->
  <path d="M 85 88 Q 85 110 80 130 Q 90 110 85 88" fill="#FFC107" />
  <circle cx="80" cy="135" r="3" fill="#FFC107" />
</svg>
